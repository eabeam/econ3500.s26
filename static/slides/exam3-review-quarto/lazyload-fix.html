<script>
 (function () {
 function ensureSrc() {
 document.querySelectorAll("img[data-src]").forEach(function (img) {
 if (!img.getAttribute("src")) {
 img.setAttribute("src", img.getAttribute("data-src"));
 }
 });
 document.querySelectorAll("source[data-src]").forEach(function (source) {
 if (!source.getAttribute("src")) {
 source.setAttribute("src", source.getAttribute("data-src"));
 }
 });
 }

 function relayout() {
 if (window.Reveal && typeof window.Reveal.layout === "function") {
 window.Reveal.layout();
 }
 }

 function hookReveal() {
 if (window.Reveal && typeof window.Reveal.on === "function") {
 window.Reveal.on("ready", function () {
 ensureSrc();
 relayout();
 });
 window.Reveal.on("slidechanged", relayout);
 window.Reveal.on("overviewshown", function () {
 ensureSrc();
 relayout();
 });
 window.Reveal.on("overviewhidden", relayout);
 return true;
 }
 return false;
 }

 document.addEventListener("DOMContentLoaded", function () {
 ensureSrc();
 relayout();

 var imgs = document.querySelectorAll(".reveal img");
 var pending = 0;
 imgs.forEach(function (img) {
 if (!img.complete) {
 pending += 1;
 img.addEventListener(
 "load",
 function () {
 pending -= 1;
 if (pending === 0) {
 relayout();
 }
 },
 { once: true }
 );
 }
 });
 if (pending === 0) {
 relayout();
 }
 });

 window.addEventListener("load", relayout);

 if (!hookReveal()) {
 var tries = 0;
 var t = window.setInterval(function () {
 tries += 1;
 if (hookReveal() || tries > 20) {
 window.clearInterval(t);
 }
 }, 250);
 }
 })();
</script>
